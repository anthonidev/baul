name: Baul
options:
  bundleIdPrefix: dev.tonis
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: es
packages:
  BaulKit:
    path: Packages/BaulKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: RS79YL6DLM
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Baul:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: BaulKit
        products: [BaulCore, BaulPersistence, BaulSystem, BaulUI]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Baul
        CFBundleDisplayName: Baúl
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Uso personal"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.tonis.baul.clip
            UTTypeDescription: Elemento de Baúl
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_NAME: Baul
        PRODUCT_BUNDLE_IDENTIFIER: dev.tonis.baul
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
